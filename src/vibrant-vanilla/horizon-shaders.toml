schema = 1
api = "0.1"
id = "vibrant_vanilla"
name = "Vibrant Vanilla+"
version = "1.0.0"

[[options]]
id = "vibrance"
name = "Color Vibrance"
description = "Boosts muted colors without clipping already saturated tones."
type = "float"
default = 0.35
min = 0.0
max = 0.85
step = 0.05

[[options]]
id = "sun_warmth"
name = "Sunlight Warmth"
description = "Warm directional sunlight highlight on outdoor blocks."
type = "float"
default = 0.30
min = 0.0
max = 0.70
step = 0.05

[sky]
file = "sky.wgsl"

[material]
file = "material.wgsl"

[[post]]
file = "post.wgsl"
