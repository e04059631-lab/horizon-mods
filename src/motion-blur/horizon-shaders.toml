schema = 1
api = "0.1"
id = "motion_blur"
name = "Motion Blur"
version = "1.0.0"

[[options]]
id = "blur_strength"
name = "Blur Strength"
description = "Intensity of the camera motion blur effect."
type = "float"
default = 0.65
min = 0.1
max = 1.5
step = 0.05

[[options]]
id = "blur_samples"
name = "Quality (Samples)"
description = "Number of samples along the motion vector. Higher looks smoother."
type = "int"
default = 10
min = 4
max = 20

[[options]]
id = "blur_sky"
name = "Blur Sky"
description = "Apply subtle rotational blur to the sky and clouds."
type = "bool"
default = true

[[post]]
file = "post.wgsl"
