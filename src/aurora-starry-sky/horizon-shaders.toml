schema = 1
api = "0.1"
id = "aurora_starry_sky"
name = "Aurora & Starry Sky"
version = "1.0.0"

[[options]]
id = "aurora_intensity"
name = "Aurora Brightness"
description = "Brightness of the northern lights at night."
type = "float"
default = 0.85
min = 0.1
max = 1.6
step = 0.05

[[options]]
id = "star_density"
name = "Star Brightness"
description = "Intensity of night stars and Milky Way glow."
type = "float"
default = 0.90
min = 0.0
max = 1.6
step = 0.05

[sky]
file = "sky.wgsl"
