schema = 1
api = "0.1"
id = "retro_ps1_crt"
name = "Retro PS1 / CRT"
version = "1.0.0"

[[options]]
id = "pixel_size"
name = "Pixel Scale"
description = "Retro pixel blockiness (1 = native resolution, 3 = classic PS1)."
type = "int"
default = 2
min = 1
max = 6

[[options]]
id = "scanlines"
name = "CRT Scanlines"
description = "Strength of horizontal CRT scanlines."
type = "float"
default = 0.25
min = 0.0
max = 0.70
step = 0.05

[[post]]
file = "post.wgsl"
