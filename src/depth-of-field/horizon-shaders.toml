schema = 1
api = "0.1"
id = "depth_of_field"
name = "Depth of Field"
version = "1.0.0"

[[options]]
id = "aperture"
name = "Bokeh Blur Amount"
description = "Strength of out-of-focus background and foreground blur."
type = "float"
default = 0.55
min = 0.10
max = 1.25
step = 0.05

[[options]]
id = "focus_range"
name = "In-Focus Depth Range"
description = "How wide the sharp focal zone is."
type = "float"
default = 14.0
min = 3.0
max = 45.0
step = 1.0

[[post]]
file = "post.wgsl"
