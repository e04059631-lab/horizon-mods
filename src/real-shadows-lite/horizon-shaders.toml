schema = 1
api = "0.1"
id = "real_shadows_lite"
name = "Real Shadows Lite"
version = "1.0.0"

[[options]]
id = "shadow_strength"
name = "Shadow Darkness"
description = "How deep outdoor shadows look."
type = "float"
default = 0.55
min = 0.15
max = 0.85
step = 0.05

[[options]]
id = "softness"
name = "Shadow Softness"
description = "PCF filter radius for smooth shadow edges."
type = "float"
default = 1.25
min = 0.4
max = 2.5
step = 0.05

[shadow]
resolution = 1024
distance = 72.0

[material]
file = "material.wgsl"
