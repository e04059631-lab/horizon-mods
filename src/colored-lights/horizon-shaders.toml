schema = 1
api = "0.1"
id = "colored_lights"
name = "Dynamic Colored Lights"
version = "1.0.0"

[[options]]
id = "light_intensity"
name = "Colored Light Strength"
description = "Intensity of colored block lighting around light sources."
type = "float"
default = 0.85
min = 0.2
max = 1.6
step = 0.05

[[options]]
